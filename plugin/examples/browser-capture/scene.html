<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; width: 100%; height: 100%; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; }
  #square { position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; margin: -15% 0 0 -15%; background: #c7f36b; border-radius: 4%; }
  #label { position: absolute; left: 10%; top: 12%; font: 700 8vh Arial, sans-serif; color: #f3f4ef; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="square"></div>
  <div id="label">VCR</div>
</div>
<script>
  // Animations are paused and assigned by absolute time; nothing reads a wall clock.
  const square = document.querySelector("#square");
  const label = document.querySelector("#label");
  const animations = [
    square.animate(
      [{ transform: "rotate(0deg) scale(1)" }, { transform: "rotate(360deg) scale(0.6)" }],
      { duration: 3000, easing: "ease-in-out", fill: "both" },
    ),
    label.animate(
      [{ opacity: 0, transform: "translateX(0px)" }, { opacity: 1, transform: "translateX(120px)" }],
      { duration: 1500, delay: 500, easing: "cubic-bezier(0.215, 0.61, 0.355, 1)", fill: "both" },
    ),
    square.animate(
      [{ opacity: 1 }, { opacity: 0.35 }],
      { duration: 1000, delay: 2000, easing: "linear", fill: "both" },
    ),
  ];
  animations.forEach((animation) => animation.pause());
  document.fonts.ready.then(() => {
    window.__scene = {
      duration: 3,
      seek: (seconds) => animations.forEach((animation) => { animation.currentTime = seconds * 1000; }),
    };
  });
</script>
</body>
</html>
