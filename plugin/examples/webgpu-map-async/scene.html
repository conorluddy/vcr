<!doctype html>
<meta charset="utf-8">
<title>Native WebGPU compute readback</title>
<script type="module">
const inputValues = [0, 1, -2, 0.25, 3.5, -1.5, 2.25, -0.125];
const shader = [
  '@group(0) @binding(0) var<storage, read> inputValues: array<f32>;',
  '@group(0) @binding(1) var<storage, read_write> outputValues: array<f32>;',
  '',
  '@compute @workgroup_size(8)',
  'fn main(@builtin(global_invocation_id) gid: vec3<u32>) {',
  '  if (gid.x < 8u) {',
  '    outputValues[gid.x] = inputValues[gid.x] * 3.0 + 0.5;',
  '  }',
  '}',
].join('\n');

window.runWebGPUCompute = async () => {
  if (!window.isSecureContext) throw new Error('WebGPU requires a secure context');
  if (!navigator.gpu) throw new Error('navigator.gpu is unavailable');
  const adapter = await Promise.race([
    navigator.gpu.requestAdapter({ powerPreference: 'low-power' }),
    new Promise((_, reject) => setTimeout(() => reject(new Error('requestAdapter timed out')), 15000)),
  ]);
  if (!adapter) throw new Error('WebGPU adapter unavailable');
  const device = await adapter.requestDevice();
  const module = device.createShaderModule({ code: shader });
  const compilation = await module.getCompilationInfo();
  const errors = compilation.messages.filter(message => message.type === 'error');
  if (errors.length) throw new Error(errors.map(error => error.message).join('\n'));
  const pipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module, entryPoint: 'main' },
  });
  const input = new Float32Array(inputValues);
  const inputBuffer = device.createBuffer({
    size: input.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  const outputBuffer = device.createBuffer({
    size: input.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
  });
  const readBuffer = device.createBuffer({
    size: input.byteLength,
    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(inputBuffer, 0, input);
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: inputBuffer } },
      { binding: 1, resource: { buffer: outputBuffer } },
    ],
  });
  const outputs = [];
  for (let index = 0; index < 3; index++) {
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.dispatchWorkgroups(1);
    pass.end();
    encoder.copyBufferToBuffer(outputBuffer, 0, readBuffer, 0, input.byteLength);
    device.queue.submit([encoder.finish()]);
    await device.queue.onSubmittedWorkDone();
    await readBuffer.mapAsync(GPUMapMode.READ);
    const mapped = readBuffer.getMappedRange();
    outputs.push(Array.from(new Float32Array(mapped)));
    readBuffer.unmap();
  }
  const adapterInfo = adapter.info;
  const summary = {
    secureContext: window.isSecureContext,
    webgpuUsed: true,
    adapter: {
      vendor: adapterInfo.vendor,
      architecture: adapterInfo.architecture,
      device: adapterInfo.device,
      description: adapterInfo.description,
    },
    features: Array.from(adapter.features).sort(),
    maxComputeWorkgroupSizeX: adapter.limits.maxComputeWorkgroupSizeX,
    shaderErrorCount: errors.length,
    mappedReadCount: outputs.length,
    inputValues,
    outputs,
  };
  inputBuffer.destroy();
  outputBuffer.destroy();
  readBuffer.destroy();
  device.destroy();
  return summary;
};
</script>
