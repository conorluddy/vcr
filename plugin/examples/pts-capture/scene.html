<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas id="stage" width="1280" height="720"></canvas><script src="node_modules/pts/dist/pts.min.js"></script><script>
// Pts clears a canvas-bound space about 100 ms after construction, so __scene is exposed from its ready callback.
const space = new Pts.CanvasSpace("#stage", () => { window.__scene = { duration: 3, seek(t) { requestAnimationFrame(() => drawScene(t)); } }; }).setup({bgcolor:"transparent", retina:false});
const form = new Pts.CanvasForm(space);
const centre = new Pts.Pt(640, 360);
const ring = Pts.Create.radialPts(centre, 240, 16);
const lineStart = new Pts.Pt(140, 540);
const lineEnd = new Pts.Pt(1140, 540);
const lineTicks = Pts.Line.subpoints([lineStart, lineEnd], 10);
function drawScene(t) {
  space.clear();
  form.fillOnly("#6bc7f3");
  ring.forEach((p) => form.point(p, 4, "circle"));
  form.strokeOnly("#6bc7f3", 4, "round").line([lineStart, lineEnd]);
  lineTicks.forEach((p) => form.fillOnly("#6bc7f3").point(p, 3, "square"));
  const hexCentre = new Pts.Pt(640 + 120 * Math.cos(t * 1.3), 360 + 60 * Math.sin(t * 1.3));
  const hex = Pts.Polygon.fromCenter(hexCentre, 150 + 60 * Math.sin(t * 2), 6).rotate2D(t * 0.8, hexCentre);
  form.strokeOnly("#c7f36b", 6, "round").fillOnly("rgba(199,243,107,0.35)").polygon(hex);
  form.fillOnly("#f3a86b").circle(Pts.Circle.fromCenter(Pts.Polygon.centroid(hex), 10));
  const marker = Pts.Geom.interpolate(lineStart, lineEnd, (1 - Math.cos(t * 2)) / 2);
  form.fillOnly("rgba(243,168,107,0.6)").circle(Pts.Circle.fromCenter(marker, 22));
}
</script></body></html>
