<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HyperFrames square motion fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 192px; height: 108px; margin: 0; overflow: hidden; background: #fff; }
      #root { position: relative; width: 192px; height: 108px; overflow: hidden; background: #fff; }
      #square { position: absolute; left: 20px; top: 42px; width: 24px; height: 24px; background: #e31b23; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="root" data-no-timeline data-start="0" data-duration="1" data-width="192" data-height="108" data-fps="12">
      <div id="square" class="clip" data-start="0" data-duration="1" data-track-index="0"></div>
    </main>
  </body>
</html>
