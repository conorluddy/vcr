<!doctype html>
<html>
<head><meta charset="utf-8" /><style>html, body { margin: 0; background: transparent; overflow: hidden; }</style></head>
<body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
  // Three.js scene drawn through a postprocessing EffectComposer: RenderPass, then one merged EffectPass
  // holding Bloom, Vignette and ChromaticAberration. seek(t) sets every scene and effect value from t
  // and calls composer.render(0), so the composer's internal timer and the effects' time uniforms never advance.
  // No NoiseEffect or GlitchEffect: both draw from Math.random and are outside this claim.
  import * as THREE from "./node_modules/three/build/three.module.js";
  import {
    BloomEffect,
    ChromaticAberrationEffect,
    EffectComposer,
    EffectPass,
    RenderPass,
    VignetteEffect,
  } from "./node_modules/postprocessing/build/index.js";

  const DURATION = 3;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.2, 5);
  camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(3, 4, 5);
  scene.add(key);

  const knotMaterial = new THREE.MeshStandardMaterial({ color: 0x3f7a52, emissive: 0x2a4a1c, emissiveIntensity: 1, roughness: 0.4 });
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.8, 0.26, 160, 24), knotMaterial);
  knot.scale.setScalar(1.2);
  scene.add(knot);

  const orbMaterial = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xff8a3d, emissiveIntensity: 3 });
  const orbs = [0, 1, 2].map(() => new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 16), orbMaterial));
  orbs.forEach((orb) => scene.add(orb));

  const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new BloomEffect({ intensity: 1.1, luminanceThreshold: 0.6, luminanceSmoothing: 0.1, mipmapBlur: true });
  const vignette = new VignetteEffect({ darkness: 0.9, offset: 0.25 });
  const chromatic = new ChromaticAberrationEffect({ offset: new THREE.Vector2(0.001, 0.001) });
  composer.addPass(new EffectPass(camera, bloom, vignette, chromatic));

  // seek sets state only; the draw happens on the animation frame that the harness's beginFrame drives.
  // A synchronous WebGL render inside seek would block on the compositor, which is waiting for us.
  const renderAt = (t) => {
    const phase = (t / DURATION) * Math.PI * 2;
    knot.rotation.set(t * 0.9, t * 1.3, 0);
    knot.position.y = Math.sin(phase) * 0.25;
    orbs.forEach((orb, index) => {
      const angle = phase + (index * Math.PI * 2) / orbs.length;
      orb.position.set(Math.cos(angle) * 1.6, Math.sin(angle) * 0.5, Math.sin(angle) * 0.6);
    });
    chromatic.offset.set(0.001 + 0.0015 * (0.5 + 0.5 * Math.sin(phase)), 0.001);
    bloom.intensity = 0.9 + 0.4 * (0.5 + 0.5 * Math.cos(phase));
    composer.render(0);
  };
  window.__scene = {
    duration: DURATION,
    seek: (t) => requestAnimationFrame(() => renderAt(t)),
  };
</script>
</body>
</html>
