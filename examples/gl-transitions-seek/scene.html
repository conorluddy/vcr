<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; width: 100%; height: 100%; overflow: hidden; }
  #stage { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="node_modules/gl-transitions/gl-transitions.js"></script>
<script>
  // The GL Transition comes from the gl-transitions browser build, looked up by name and run in raw WebGL 1.
  // Progress is a pure function of t: progress = clamp(t / DURATION_S). Nothing reads a clock or random source.
  const DURATION_S = 2;
  const TRANSITION_NAME = "Fade";
  // Solid generated textures, opaque, so the only variable is progress.
  const FROM_RGB = [200, 40, 0];
  const TO_RGB = [0, 120, 255];

  const transition = window.GLTransitions.find((entry) => entry.name === TRANSITION_NAME);
  if (!transition) throw new Error(`gl-transitions has no transition named ${TRANSITION_NAME}`);

  const canvas = document.querySelector("#stage");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true });
  if (!gl) throw new Error("WebGL 1 is unavailable in this browser");

  // The library's glsl implements vec4 transition(vec2 uv) and calls getFromColor/getToColor/progress/ratio (GL Transitions spec v1).
  const FRAGMENT_PREFIX = `precision highp float;
uniform float progress;
uniform float ratio;
uniform sampler2D fromTexture;
uniform sampler2D toTexture;
varying vec2 vUv;
vec4 getFromColor(vec2 uv) { return texture2D(fromTexture, uv); }
vec4 getToColor(vec2 uv) { return texture2D(toTexture, uv); }
`;
  const FRAGMENT_SUFFIX = `
void main() { gl_FragColor = transition(vUv); }
`;
  const VERTEX_SOURCE = `attribute vec2 position;
varying vec2 vUv;
void main() { vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }
`;

  function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(`Shader compile failed: ${gl.getShaderInfoLog(shader)}`);
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl.VERTEX_SHADER, VERTEX_SOURCE));
  gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, FRAGMENT_PREFIX + transition.glsl + FRAGMENT_SUFFIX));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(`Program link failed: ${gl.getProgramInfoLog(program)}`);
  gl.useProgram(program);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const positionLocation = gl.getAttribLocation(program, "position");
  gl.enableVertexAttribArray(positionLocation);
  gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

  function createSolidTexture(rgb, textureUnit) {
    const [red, green, blue] = rgb;
    gl.activeTexture(gl.TEXTURE0 + textureUnit);
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    const texels = new Uint8Array([red, green, blue, 255, red, green, blue, 255, red, green, blue, 255, red, green, blue, 255]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, texels);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return texture;
  }
  createSolidTexture(FROM_RGB, 0);
  createSolidTexture(TO_RGB, 1);
  gl.uniform1i(gl.getUniformLocation(program, "fromTexture"), 0);
  gl.uniform1i(gl.getUniformLocation(program, "toTexture"), 1);
  gl.uniform1f(gl.getUniformLocation(program, "ratio"), canvas.width / canvas.height);
  const progressLocation = gl.getUniformLocation(program, "progress");

  let progress = 0;
  let isDrawScheduled = false;

  function draw() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(progressLocation, progress);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // Seeks only set state; the frame is drawn on the next animation frame, as the capture route expects.
  function scheduleDraw() {
    if (isDrawScheduled) return;
    isDrawScheduled = true;
    requestAnimationFrame(() => {
      isDrawScheduled = false;
      draw();
    });
  }

  const debugRendererInfo = gl.getExtension("WEBGL_debug_renderer_info");
  window.__glInfo = {
    renderer: String(debugRendererInfo ? gl.getParameter(debugRendererInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)),
    transition: transition.name,
    transitionCount: window.GLTransitions.length,
    license: transition.license,
  };

  window.__scene = {
    duration: DURATION_S,
    seek: (seconds) => {
      progress = Math.min(1, Math.max(0, seconds / DURATION_S));
      scheduleDraw();
    },
  };
  draw();
</script>
</body>
</html>
