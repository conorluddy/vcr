<!doctype html>
<html>
<head><meta charset="utf-8" /><style>html, body { margin: 0; background: transparent; }</style></head>
<body>
<script src="./node_modules/p5/lib/p5.min.js"></script>
<script>
  // p5 in instance mode with the loop stopped. Every frame is a pure function of t and the seed:
  // noiseSeed and randomSeed are reset inside seek so shuffled capture matches sequential.
  const DURATION = 3;
  const SEED = 7;
  new p5((sketch) => {
    sketch.setup = () => {
      sketch.createCanvas(window.innerWidth, window.innerHeight);
      sketch.pixelDensity(1);
      sketch.noLoop();
      // seek schedules the draw on the animation frame the harness drives; see three-capture for why.
      window.__scene = { duration: DURATION, seek: (t) => requestAnimationFrame(() => sketch.redraw(t)) };
      window.__sceneTime = 0;
    };
    sketch.redraw = (t) => {
      window.__sceneTime = t;
      sketch.draw();
    };
    sketch.draw = () => {
      const t = window.__sceneTime;
      sketch.clear();
      sketch.noiseSeed(SEED);
      sketch.randomSeed(SEED);
      sketch.noStroke();
      for (let i = 0; i < 120; i += 1) {
        const phase = sketch.random();
        const x = sketch.noise(i * 0.13, t * 0.4) * sketch.width;
        const y = sketch.noise(i * 0.31 + 50, t * 0.4) * sketch.height;
        const r = 12 + 30 * sketch.noise(i, t + phase);
        sketch.fill(199, 243, 107, 120 + 100 * sketch.sin(t * 2 + phase * 6));
        sketch.circle(x, y, r);
      }
    };
  });
</script>
</body>
</html>
