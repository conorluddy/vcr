<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}#stage{display:block;width:1280px;height:720px}</style></head>
<body><canvas id="stage" width="1280" height="720"></canvas><script src="node_modules/playcanvas/build/playcanvas.min.js"></script><script>
// No app.start(): no engine tick loop. seek(t) sets every transform from t, then calls app.update(0) and app.render() once.
const canvas = document.getElementById('stage');
const app = new pc.Application(canvas, {devtools:false, graphicsDeviceOptions:{alpha:true, preserveDrawingBuffer:true, antialias:false}});
app.setCanvasFillMode(pc.FILLMODE_NONE, 1280, 720);
app.setCanvasResolution(pc.RESOLUTION_FIXED, 1280, 720);
app.scene.ambientLight = new pc.Color(0.25, 0.25, 0.25);
const camera = new pc.Entity('camera');
camera.addComponent('camera', {clearColor:new pc.Color(0,0,0,0), clearColorBuffer:true, fov:40});
camera.setPosition(0, 1.4, 8);
camera.lookAt(0, 0, 0);
app.root.addChild(camera);
const sun = new pc.Entity('sun');
sun.addComponent('light', {type:'directional', intensity:1.2, color:new pc.Color(1,1,1)});
sun.setEulerAngles(45, 30, 0);
app.root.addChild(sun);
const material = (r, g, b) => { const m = new pc.StandardMaterial(); m.diffuse = new pc.Color(r, g, b); m.update(); return m; };
const primitive = (type, color) => {
  const entity = new pc.Entity(type);
  entity.addComponent('render', {type, material: material(...color)});
  app.root.addChild(entity);
  return entity;
};
const box = primitive('box', [0.78, 0.95, 0.42]);
const sphere = primitive('sphere', [0.95, 0.66, 0.42]);
const cylinder = primitive('cylinder', [0.42, 0.78, 0.95]);
const renderAt = (t) => {
  box.setLocalPosition(-2.2, 0.35 * Math.sin(t * 2), 0);
  box.setLocalEulerAngles(t * 60, t * 90, 0);
  sphere.setLocalPosition(1.3 * Math.cos(t * 1.5), 0.2, 1.3 * Math.sin(t * 1.5));
  sphere.setLocalScale(0.9, 0.9, 0.9);
  cylinder.setLocalPosition(2.2, -0.2, 0);
  cylinder.setLocalEulerAngles(0, 0, 20 * Math.sin(t * 2));
  cylinder.setLocalScale(0.6 + 0.2 * Math.sin(t * 2), 1.1, 0.6 + 0.2 * Math.sin(t * 2));
  app.update(0);
  app.render();
};
window.__scene = {duration:3, seek:(t) => requestAnimationFrame(() => renderAt(t))};
</script></body></html>
