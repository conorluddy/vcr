<!doctype html>
<meta charset="utf-8">
<title>Native WebGL readPixels fixture</title>
<style>html,body{margin:0;background:#101828}canvas{display:block;width:96px;height:72px}</style>
<canvas id="scene" width="96" height="72"></canvas>
<script>
(() => {
  const canvas = document.querySelector('#scene');
  const gl = canvas.getContext('webgl', {
    alpha: false,
    antialias: false,
    depth: false,
    preserveDrawingBuffer: true,
    premultipliedAlpha: false,
  });
  if (!gl) throw new Error('WebGL 1 context unavailable');
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  };
  const vertex = compile(gl.VERTEX_SHADER, `
    attribute vec2 aPosition;
    uniform float uOffset;
    void main() { gl_Position = vec4(aPosition.x + uOffset, aPosition.y, 0.0, 1.0); }
  `);
  const fragment = compile(gl.FRAGMENT_SHADER, `
    precision mediump float;
    void main() { gl_FragColor = vec4(0.12, 0.84, 0.52, 1.0); }
  `);
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.65, -0.65, 0.65, -0.65, 0.0, 0.65]), gl.STATIC_DRAW);
  gl.useProgram(program);
  const position = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const offset = gl.getUniformLocation(program, 'uOffset');
  gl.disable(gl.BLEND);
  gl.disable(gl.DITHER);

  const hash = (bytes) => {
    let value = 2166136261;
    for (const byte of bytes) {
      value ^= byte;
      value = Math.imul(value, 16777619);
    }
    return (value >>> 0).toString(16).padStart(8, '0');
  };
  const render = (time) => {
    const xOffset = -0.2 + 0.4 * time;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(16 / 255, 24 / 255, 40 / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(offset, xOffset);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    const pixels = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    return { time, hash: hash(pixels), pixels: Array.from(pixels) };
  };
  const extension = gl.getExtension('WEBGL_debug_renderer_info');
  const attrs = gl.getContextAttributes();
  window.fixture = {
    width: canvas.width,
    height: canvas.height,
    glVersion: gl.getParameter(gl.VERSION),
    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
    vendor: extension ? gl.getParameter(extension.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
    renderer: extension ? gl.getParameter(extension.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
    contextAttributes: attrs,
    render,
  };
})();
</script>
