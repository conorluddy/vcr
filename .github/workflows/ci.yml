name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The lint integration tests drive real Chromium; --with-deps also brings Liberation fonts (Arial metrics).
      # The install has hung on the runner's downloads, so each attempt is capped and retried rather than left to the job timeout.
      - name: Install Chromium headless shell
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            timeout 180 pnpm --filter @vcr/capture exec playwright install --with-deps --only-shell chromium && exit 0
            echo "::warning::Chromium install attempt $attempt failed or timed out; retrying"
          done
          exit 1
      - run: pnpm typecheck
      - run: pnpm validate
      - run: pnpm test
