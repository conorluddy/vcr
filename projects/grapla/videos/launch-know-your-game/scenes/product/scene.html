<!doctype html>
<html>
<head><meta charset="utf-8" /><link rel="stylesheet" href="/videos/launch-know-your-game/scenes/shared.css" />
<style>
  canvas { position: absolute; inset: 0; }
  #caption { position: absolute; left: 96px; right: 96px; top: 1560px; opacity: 0; }
  #caption .label { display: block; margin-bottom: 14px; }
  #caption .body { font-size: 40px; }
</style></head>
<body>
<div id="caption"><span class="label" id="label"></span><span class="body muted" id="text"></span></div>
<script type="module">
  import * as THREE from "/node_modules/three/build/three.module.js";
  const DURATION = 11, W = 1080, H = 1920;
  const SHOTS = [
    { src: "/assets/screenshots/app-base-dashboard.png", label: "BASE", text: "your BJJ at a glance" },
    { src: "/assets/screenshots/app-atlas-overview.png", label: "ATLAS", text: "600+ entities, 4,000+ transitions" },
    { src: "/assets/screenshots/app-session-detail.png", label: "TRAINING LOG", text: "voice or text, no account" },
  ];
  const SHOT_S = DURATION / SHOTS.length;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 50);
  camera.position.set(0, 0.05, 4.2); camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(2.5, 3, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffc918, 0.35); rim.position.set(-3, -1, -2); scene.add(rim);
  const loader = new THREE.TextureLoader();
  const textures = await Promise.all(SHOTS.map((s) => loader.loadAsync(s.src)));
  textures.forEach((tx) => { tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; });
  const phone = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.78, 1.64, 0.07), new THREE.MeshStandardMaterial({ color: 0x0c0b09, metalness: 0.6, roughness: 0.35, transparent: true }));
  const screenMat = new THREE.MeshBasicMaterial({ map: textures[0], transparent: true });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.70, 1.522), screenMat);
  screen.position.z = 0.0355;
  phone.add(frame, screen); scene.add(phone);
  const caption = document.getElementById("caption"), label = document.getElementById("label"), text = document.getElementById("text");
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const renderAt = (t) => {
    const shot = Math.min(SHOTS.length - 1, Math.floor(t / SHOT_S)), local = t - shot * SHOT_S;
    screenMat.map = textures[shot]; screenMat.needsUpdate = true;
    label.textContent = SHOTS[shot].label; text.textContent = SHOTS[shot].text;
    const enter = ease(t / 0.8), exit = 1 - ease((t - (DURATION - 0.5)) / 0.5);
    const s = (0.92 + 0.08 * enter) * (0.96 + 0.04 * exit);
    phone.scale.setScalar(s);
    phone.rotation.set(0.05 * Math.sin(t * 0.5), 0.26 * Math.sin(t * 0.7) + 0.35 * (1 - enter), 0);
    phone.position.y = 0.12 + 0.03 * Math.sin(t * 0.9);
    frame.material.opacity = screenMat.opacity = enter * exit;
    const cap = Math.min(ease((local - 0.25) / 0.4), 1 - ease((local - (SHOT_S - 0.45)) / 0.35)) * exit;
    caption.style.opacity = String(Math.max(0, cap));
    caption.style.transform = `translateY(${(1 - cap) * 12}px)`;
    renderer.render(scene, camera);
  };
  await document.fonts.ready;
  window.__scene = { duration: DURATION, seek: (t) => requestAnimationFrame(() => renderAt(t)) };
</script>
</body>
</html>
