<!doctype html>
<html>
<head><meta charset="utf-8" /><style>html, body { margin: 0; overflow: hidden; }</style></head>
<body>
<script src="/node_modules/p5/lib/p5.min.js"></script>
<script>
  // Dot grid plus a drifting knowledge graph in amber. Opaque: this is the base layer.
  // Everything is a function of t and SEED; seeds are reset every draw so frame order never matters.
  const DURATION = 20, W = 1080, H = 1920, SEED = 131, NODES = 56, PITCH = 48, LINK = 240;
  const BG = [30, 29, 25], DOT = [51, 51, 51], NODE = [120, 116, 108], AMBER = [255, 201, 24];
  new p5((sk) => {
    sk.setup = () => {
      sk.createCanvas(W, H); sk.pixelDensity(1); sk.noLoop();
      window.__scene = { duration: DURATION, seek: (t) => requestAnimationFrame(() => { window.__t = t; sk.redraw(); }) };
    };
    sk.draw = () => {
      const t = window.__t ?? 0;
      sk.noiseSeed(SEED); sk.randomSeed(SEED);
      sk.background(...BG);
      sk.noStroke(); sk.fill(...DOT);
      for (let y = PITCH / 2; y < H; y += PITCH) for (let x = PITCH / 2; x < W; x += PITCH) sk.rect(x, y, 2, 2);
      const nodes = [];
      for (let i = 0; i < NODES; i += 1) {
        const bx = sk.random(80, W - 80), by = sk.random(120, H - 120);
        nodes.push({ x: bx + (sk.noise(i * 0.37, t * 0.06) - 0.5) * 160, y: by + (sk.noise(i * 0.53 + 9, t * 0.06) - 0.5) * 160 });
      }
      // Nearest-neighbour chain from a fixed start, so the lit path takes short hops instead of crossing the frame.
      const path = [3];
      while (path.length < 7) {
        const last = nodes[path[path.length - 1]];
        let best = -1, bestD = Infinity;
        nodes.forEach((n, i) => { if (path.includes(i)) return; const d = sk.dist(last.x, last.y, n.x, n.y); if (d < bestD) { bestD = d; best = i; } });
        path.push(best);
      }
      const lit = Math.min(path.length - 1, Math.floor(t / 2.8));
      sk.strokeWeight(1.5);
      for (let i = 0; i < NODES; i += 1) for (let j = i + 1; j < NODES; j += 1) {
        const d = sk.dist(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
        if (d > LINK) continue;
        sk.stroke(NODE[0], NODE[1], NODE[2], 70 * (1 - d / LINK));
        sk.line(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
      }
      sk.strokeWeight(2);
      for (let k = 0; k < lit; k += 1) {
        const a = nodes[path[k]], b = nodes[path[k + 1]], prog = Math.min(1, (t - k * 2.8) / 1.0);
        sk.stroke(AMBER[0], AMBER[1], AMBER[2], 150);
        sk.line(a.x, a.y, a.x + (b.x - a.x) * prog, a.y + (b.y - a.y) * prog);
      }
      sk.noStroke();
      nodes.forEach((n, i) => {
        const onPath = path.indexOf(i), isLit = onPath >= 0 && onPath <= lit;
        if (isLit) sk.fill(...AMBER); else sk.fill(NODE[0], NODE[1], NODE[2], 180);
        const s = isLit ? 12 : 8;
        sk.rect(n.x - s / 2, n.y - s / 2, s, s);
      });
    };
  });
</script>
</body>
</html>
