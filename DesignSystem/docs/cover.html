<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VCRStudio</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--vcr-ground); color: var(--vcr-text-primary); font-family: var(--font-vcr-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; }
  .art svg { display: block; width: 480px; height: 288px; }
  .backing { fill: var(--vcr-artboard-backing); }
  .tile { fill: var(--vcr-placeholder); }
  .selected { fill: var(--vcr-bone); }
  .pending { fill: none; stroke: var(--vcr-line-hover); stroke-width: 1; stroke-dasharray: 3 3; }
  .outline-dark { fill: none; stroke: var(--vcr-outline-dark); stroke-width: 1; }
  .outline-light { fill: none; stroke: var(--vcr-outline-light); stroke-width: 1; }
  .signal { fill: var(--vcr-signal-amber); }
  .words { position: absolute; left: var(--vcr-artboard-padding); bottom: var(--vcr-artboard-padding); max-width: 420px; }
  .name { margin: 0; font-size: 80px; line-height: 0.95; font-weight: 400; letter-spacing: -0.01em; color: var(--vcr-text-primary); }
  .tagline { margin: var(--vcr-space-5) 0 0 3px; font-size: 13px; line-height: 20px; color: var(--vcr-text-tertiary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks       vcr-artboard-backing 480×288 slab (half the cover, the surround every design sits on) · vcr-placeholder tiles (the tint) · one vcr-bone tile merged two-by-two (the selected variant, the one emphasis colour) · vcr-signal-amber once as a 6px status square
  arrangement  a contact sheet bleeding off the top, right and bottom edges, behind the name's zone, never crossing it
  pattern      tiles, from "geometric, modular, dense UI" and the system's own subject: a round of 4:5 variants on the backing, one pending (dashed vcr-line-hover), one carrying a region outline (vcr-outline-light inside vcr-outline-dark)
  scales       tile 48×60 (4:5); gap vcr-space-6 (12px); inset vcr-tile-padding (10px); outline vcr-outline-width (1px); square corners, as the radii stop at 3px; status square 6px
-->
<rect class="backing" x="0" y="0" width="480" height="288"/>
<rect class="tile" x="10" y="-20" width="48" height="60"/>
<rect class="tile" x="70" y="-20" width="48" height="60"/>
<rect class="tile" x="130" y="-20" width="48" height="60"/>
<rect class="tile" x="190" y="-20" width="48" height="60"/>
<rect class="tile" x="250" y="-20" width="48" height="60"/>
<rect class="pending" x="310.5" y="-19.5" width="47" height="59"/>
<rect class="tile" x="370" y="-20" width="48" height="60"/>
<rect class="tile" x="430" y="-20" width="48" height="60"/>
<rect class="tile" x="10" y="52" width="48" height="60"/>
<rect class="tile" x="70" y="52" width="48" height="60"/>
<rect class="selected" x="130" y="52" width="108" height="132"/>
<rect class="tile" x="250" y="52" width="48" height="60"/>
<rect class="tile" x="310" y="52" width="48" height="60"/>
<rect class="tile" x="370" y="52" width="48" height="60"/>
<rect class="tile" x="430" y="52" width="48" height="60"/>
<rect class="tile" x="10" y="124" width="48" height="60"/>
<rect class="tile" x="70" y="124" width="48" height="60"/>
<rect class="tile" x="250" y="124" width="48" height="60"/>
<rect class="tile" x="310" y="124" width="48" height="60"/>
<rect class="tile" x="370" y="124" width="48" height="60"/>
<rect class="outline-dark" x="375.5" y="135.5" width="38" height="26"/>
<rect class="outline-light" x="376.5" y="136.5" width="36" height="24"/>
<rect class="tile" x="430" y="124" width="48" height="60"/>
<rect class="signal" x="130" y="187" width="6" height="6"/>
<rect class="tile" x="10" y="196" width="48" height="60"/>
<rect class="tile" x="70" y="196" width="48" height="60"/>
<rect class="tile" x="130" y="196" width="48" height="60"/>
<rect class="tile" x="190" y="196" width="48" height="60"/>
<rect class="tile" x="250" y="196" width="48" height="60"/>
<rect class="tile" x="310" y="196" width="48" height="60"/>
<rect class="tile" x="370" y="196" width="48" height="60"/>
<rect class="tile" x="430" y="196" width="48" height="60"/>
<rect class="tile" x="10" y="268" width="48" height="60"/>
<rect class="tile" x="70" y="268" width="48" height="60"/>
<rect class="tile" x="130" y="268" width="48" height="60"/>
<rect class="tile" x="190" y="268" width="48" height="60"/>
<rect class="tile" x="250" y="268" width="48" height="60"/>
<rect class="tile" x="310" y="268" width="48" height="60"/>
<rect class="tile" x="370" y="268" width="48" height="60"/>
<rect class="tile" x="430" y="268" width="48" height="60"/>
</svg>
</div>
<div class="words">
<h1 class="name">VCRStudio</h1>
<p class="tagline">Grey, so the artwork is the only colour on screen.</p>
</div>
</div>
</body>
</html>
